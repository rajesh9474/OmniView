name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print $1}')
          echo "Detected Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ] || ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse major Java version."
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Java major version is $MAJOR_VER, but version 17 or newer is required."
            exit 1
          fi
          echo "Java version verification passed (major version: $MAJOR_VER)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is empty (0 bytes)."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          echo "APK verification successful: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9_-]/-/g')
          RELEASE_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$RELEASE_DIR"
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_PATH="${RELEASE_DIR}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_PATH"

          if [ ! -s "$RELEASE_PATH" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_PATH"
            exit 1
          fi

          echo "asset_path=${RELEASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Prepared release asset is invalid or missing at $ASSET_PATH"
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat <<EOF > /tmp/release_notes.md
### Debug APK Build #${GITHUB_RUN_NUMBER}

- **Type**: Automatically generated debug APK
- **Builder**: GitHub Actions
- **Run Number**: ${GITHUB_RUN_NUMBER}
- **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
- **Source Commit**: ${GITHUB_SHA}
- **Target Use**: Testing only
- **Production Note**: Not a Play Store production release
- **Signing**: Signed with temporary debug keystore
EOF

          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            RELEASE_TITLE=$(gh release view "$TAG" --json name -q .name)
            echo "Release Tag: $TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
## 🚀 Debug APK Build & Release Summary

- **Status**: ✅ APK Built and Published Successfully
- **Release Title**: $RELEASE_TITLE
- **Release Tag**: \`$TAG\`
- **Direct Download Page**: [$RELEASE_URL]($RELEASE_URL)
- **Release APK Asset**: \`$ASSET_NAME\` (available directly under Assets)
- **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also available for this run.
EOF
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
## ⚠️ Debug APK Build & Release Summary

- **Status**: ⚠️ APK Build Succeeded; Release Publishing Failed or Encountered an Issue
- **Actions Artifact**: \`app-debug-apk\` is available for download from this workflow run.
- **Note**: The build was successful and the debug APK was preserved as a workflow artifact.
EOF
          fi
